name: Deploy React app to GitHub Pages

on:
  push:
    branches:
      - main # Körs varje gång du pushar till main

permissions:
  contents: write # Ger rättighet att uppdatera gh-pages branchen

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # Säkrare variant av npm install för byggservrar

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages # Målbranchen där den färdiga koden sparas
